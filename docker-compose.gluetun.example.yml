services:
  seediku:
    environment:
      QBITTORRENT_URLS: "http://gluetun:8185"
      QBITTORRENT_WEBUI_URL: "http://localhost:8185"
      # Gluetun reports the torrent namespace's VPN egress address.
      SEEDIKU_VPN_IP_URL: "http://gluetun:8000/v1/publicip/ip"
    depends_on:
      gluetun:
        condition: service_healthy
      qbittorrent:
        condition: service_started

  gluetun:
    image: ghcr.io/qdm12/gluetun:v3.41.1
    container_name: seediku-gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - target: 8185
        published: "127.0.0.1:8185"
        protocol: tcp
      - target: 6881
        published: "6881"
        protocol: tcp
      - target: 6881
        published: "6881"
        protocol: udp
    environment:
      TZ: "Europe/Berlin"
      VPN_SERVICE_PROVIDER: "custom"
      VPN_TYPE: "wireguard"
      # Supply provider-specific settings and credentials through runtime secrets.
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - seediku-net

  qbittorrent:
    network_mode: "service:gluetun"
    ports: !reset []
    networks: !reset []
