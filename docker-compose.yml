name: seediku

services:
  seediku:
    image: ${SEEDIKU_IMAGE:-ghcr.io/maroishiku/seediku:0.1.0}
    # Use `build: .` for local development.
    container_name: seediku
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 768m
    cpus: "1.0"
    ports:
      - target: 8509
        published: "8509"
        protocol: tcp
    environment:
      TZ: "Europe/Berlin"
      PORT: "8509"
      ISHIKU_APP_URL: "http://localhost:8509"
      ISHIKU_BASE_PATH: "/"
      ISHIKU_DATA_DIR: "/data"
      ISHIKU_LOG_LEVEL: "info"
      SEEDIKU_UID: "10001"
      SEEDIKU_GID: "10001"
      ISHIKU_SETUP_SECRET_FILE: "/run/secrets/ishiku_setup_secret"
      QBITTORRENT_URLS: "http://seediku-qbittorrent:8185,http://qbittorrent:8185"
      QBITTORRENT_USERNAME: "admin"
      QBITTORRENT_PASSWORD_FILE: "/run/secrets/qbittorrent_password"
      QBITTORRENT_WEBUI_URL: "http://localhost:8185"
      # The configured service observes Seediku's direct public egress IP.
      # This request discloses the requesting address to that service.
      SEEDIKU_PUBLIC_IP_ENDPOINTS: "https://api.ipify.org?format=json"
    secrets:
      - ishiku_setup_secret
      - qbittorrent_password
    volumes:
      - seediku-data:/data
      - seediku-config:/config
    depends_on:
      qbittorrent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8509/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      icon: https://raw.githubusercontent.com/MaroIshiku/seediku/main/public/assets/logos/seediku.png
    networks:
      - seediku-net

  qbittorrent:
    image: ghcr.io/linuxserver/qbittorrent:5.2.0_v2.0.12-ls454
    container_name: seediku-qbittorrent
    restart: unless-stopped
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "Europe/Berlin"
      WEBUI_PORT: "8185"
      TORRENTING_PORT: "6881"
    volumes:
      - qbittorrent-config:/config
      - downloads-incomplete:/downloads/incomplete
      - downloads-complete:/downloads/complete
      - downloads-watch:/downloads/watch
    ports:
      - target: 8185
        published: "127.0.0.1:8185"
        protocol: tcp
      - target: 6881
        published: "6881"
        protocol: tcp
      - target: 6881
        published: "6881"
        protocol: udp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8185/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      seediku-net:
        aliases:
          - qbittorrent
          - seediku-qbittorrent

networks:
  seediku-net:
    name: seediku-net

secrets:
  ishiku_setup_secret:
    file: ./secrets/setup_secret.txt
  qbittorrent_password:
    file: ./secrets/qbittorrent_password.txt

volumes:
  seediku-data:
  seediku-config:
  qbittorrent-config:
  downloads-incomplete:
  downloads-complete:
  downloads-watch:

x-casaos:
  author: self
  category: self
  hostname: ""
  icon: https://raw.githubusercontent.com/MaroIshiku/seediku/main/public/assets/logos/seediku.png
  index: /
  is_uncontrolled: false
  port_map: "8509"
  scheme: http
  store_app_id: seediku
  title:
    custom: Seediku
    en_us: Seediku
